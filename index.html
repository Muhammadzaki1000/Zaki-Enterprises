  <style>
    /* Live Chat Container Styles */
    #live-chat-wrapper {
      max-width: 450px;
      margin: 40px auto;
      background: #0d1527;
      border: 1px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
    }
    #chat-header {
      background: #1e293b;
      padding: 14px 18px;
      font-weight: 600;
      border-bottom: 1px solid #334155;
      font-size: 16px;
    }
    #chat-box {
      height: 350px;
      padding: 16px;
      overflow-y: auto;
      background: #060b19;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 82%;
      font-size: 14px;
      line-height: 1.5;
    }
    .user-msg {
      background: #0070f3;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .ai-msg {
      background: #1e293b;
      color: #e2e8f0;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    #chat-input-area {
      display: flex;
      padding: 12px;
      background: #0d1527;
      gap: 8px;
      border-top: 1px solid #1e293b;
    }
    #user-input {
      flex: 1;
      padding: 10px 14px;
      background: #060b19;
      border: 1px solid #334155;
      color: #ffffff;
      border-radius: 6px;
      outline: none;
    }
    #user-input::placeholder {
      color: #94a3b8;
    }
    #send-btn {
      padding: 10px 18px;
      background-color: #0070f3;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    #send-btn:hover {
      background-color: #0051b3;
    }
  </style>

  <main id="main">
    <section class="hero">
      <div class="w hg">
        <div>
          <h1>Transform Your Business with <span class="gt">Intelligent AI.</span></h1>
          <p class="lead">Chat directly with our live AI Assistant below to explore solutions for your business.</p>
        </div>
      </div>
    </section>

    <!-- LIVE CLOUDFLARE + GEMINI CHAT CONTAINER -->
    <div id="live-chat-wrapper">
      <div id="chat-header">ZE Assistant (Live AI)</div>
      <div id="chat-box">
        <div class="msg ai-msg"><strong>AI Assistant:</strong> Hello! How can I help you today?</div>
      </div>
      <div id="chat-input-area">
        <input type="text" id="user-input" placeholder="Type a message...">
        <button id="send-btn">Send</button>
      </div>
    </div>
  </main>

  <!-- CLOUDFLARE WORKER FETCH SCRIPT -->
  <script>
    const sendBtn = document.getElementById('send-btn');
    const userInput = document.getElementById('user-input');
    const chatBox = document.getElementById('chat-box');

    function appendMessage(sender, text, isUser) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('msg');
      msgDiv.classList.add(isUser ? 'user-msg' : 'ai-msg');
      msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function handleSendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      appendMessage('You', message, true);
      userInput.value = '';

      appendMessage('AI Assistant', '<em>Thinking...</em>', false);

      try {
        const response = await fetch('https://zaki-enterprises.zaki-shahid12.workers.dev', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: message })
        });

        const data = await response.json();
        
        chatBox.lastElementChild.remove();
        appendMessage('AI Assistant', data.reply || 'No response from server.', false);
      } catch (error) {
        chatBox.lastElementChild.remove();
        appendMessage('AI Assistant', 'Error connecting to AI service.', false);
        console.error(error);
      }
    }

    sendBtn.addEventListener('click', handleSendMessage);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSendMessage();
    });
  </script>
</body>
